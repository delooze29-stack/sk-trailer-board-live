<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SK Trailer Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<!--
  =====================================================================
  SK DISTRIBUTION TRAILER BOARD  -  v49
  =====================================================================
  One file, plain readable code, no build step.

  HOW THE DATA IS STORED (Firebase / Firestore, project "sk-trailer-board")
    boards/live                     -> lists: locations, units, drivers, users
    boards/live/trailers/<id>       -> one record PER TRAILER
    boards/live/backups/<id>        -> backups (auto every 2h + manual)

  The test copy uses boards/test instead of boards/live. Which one is used
  is decided automatically: if the page's file name contains "test"
  (e.g. test.html) or the address ends in ?board=test, it's the TEST board.
  Otherwise it's the LIVE board.

  WHY THIS FIXES THE "GHOST DATA":
    - Every change updates ONLY the trailer you touched, inside a Firebase
      transaction (read latest -> apply change -> write). Two people editing
      at once can no longer overwrite each other's work.
    - Nothing is ever saved "automatically" from someone's screen. Only an
      actual click/edit writes anything.
    - When the connection drops, the board goes read-only instead of
      queuing up an old copy to dump on everyone later.
    - Old versions of the app write to the old place (yard/main), which
      this version never reads after the one-off import, so old open tabs
      can't bring ghosts back.
  =====================================================================
-->
<style>
  :root {
    --bg: #0e0e0e; --panel: #18181b; --panel2: #1f1f23; --black: #000;
    --line: #27272a; --line2: #3f3f46; --text: #f4f4f5; --text2: #d4d4d8;
    --muted: #a1a1aa; --dim: #71717a; --faint: #52525b;
    --accent: #009fe3; --accent-dk: #0087c2; --red: #dc2626; --green: #34d399;
    --orange: #f59e0b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled, select:disabled, input:disabled { cursor: not-allowed; opacity: .55; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 600; }
  .hidden { display: none !important; }

  /* ---------- header ---------- */
  header { position: sticky; top: 0; z-index: 40; background: var(--black); border-bottom: 1px solid var(--line); }
  .accentbar { height: 3px; background: var(--accent); }
  header.test .accentbar { background: var(--orange); }
  .hdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 34px; height: 34px; background: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--accent); font-weight: 900; letter-spacing: 2px; font-size: 14px; }
  .title { font-weight: 800; font-size: 15px; letter-spacing: .5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .title .sub { color: var(--muted); font-weight: 700; }
  .title .ver { color: var(--accent); }
  .pill { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; font-size: 10px; font-weight: 800; letter-spacing: 1.5px; color: var(--dim); }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .pill.live { color: #6ee7b7; } .pill.live .dot { background: var(--green); animation: pulse 2s infinite; }
  .pill.off { color: #fca5a5; border-color: #7f1d1d; } .pill.off .dot { background: var(--red); }
  .pill.test { color: #fcd34d; border-color: #92400e; background: #2a1a05; }
  @keyframes pulse { 50% { opacity: .35; } }
  .tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .btn { background: var(--panel); border: 1px solid var(--line2); border-radius: 5px; padding: 6px 12px; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .btn:hover:not(:disabled) { background: #27272a; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: var(--accent-dk); }
  .btn.outline { background: var(--black); border-color: var(--accent); color: var(--accent); }
  .btn.soft { background: rgba(0,159,227,.15); border-color: rgba(0,159,227,.35); color: var(--accent); }
  .btn.danger { background: #450a0a; border-color: #7f1d1d; color: #fecaca; }
  .btn.big { font-size: 13px; padding: 10px 16px; }
  .userchip { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 4px 8px; }
  .avatar { width: 24px; height: 24px; border-radius: 4px; background: #27272a; border: 1px solid var(--line2); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--text2); }
  .userchip .name { font-size: 12px; font-weight: 700; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .userchip .btn { padding: 2px 8px; font-size: 10px; }

  .banner { padding: 10px 14px; font-size: 13px; font-weight: 600; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .banner.off { background: #450a0a; color: #fecaca; border-bottom: 1px solid #7f1d1d; }
  .banner.test { background: #2a1a05; color: #fcd34d; border-bottom: 1px solid #92400e; }
  .banner.old { background: #1e3a8a; color: #dbeafe; }

  main { padding: 12px; max-width: 1920px; }

  /* ---------- location cards ---------- */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; cursor: pointer; text-align: left; min-width: 0; }
  .card:hover { border-color: #52525b; }
  .card.on { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(0,159,227,.3); }
  .card.all { border-color: rgba(0,159,227,.6); }
  .card .top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .card .nm { font-size: 11px; font-weight: 700; letter-spacing: .5px; color: var(--text2); text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .ct { font-size: 20px; font-weight: 900; }
  .chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #27272a; border: 1px solid var(--line2); color: var(--text2); }
  .chip .d { width: 6px; height: 6px; border-radius: 50%; }
  .card .peek { margin-top: 8px; font-size: 10px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin: -4px 0 14px; font-size: 11px; color: var(--dim); }
  .legend .lk { font-weight: 800; letter-spacing: 1.5px; color: var(--faint); }
  .legend .li2 { display: inline-flex; align-items: center; gap: 6px; }
  .ic { flex-shrink: 0; vertical-align: -2px; }
  .grp { display: inline-flex; gap: 6px; padding-right: 8px; margin-right: 2px; border-right: 1px solid var(--line); }
  .searchbox { position: relative; display: inline-flex; align-items: center; }
  .searchbox .ic { position: absolute; left: 10px; color: var(--dim); pointer-events: none; }
  .searchbox .field { padding-left: 32px; }
  .mlabel { font-size: 10px; font-weight: 800; letter-spacing: 1.5px; color: var(--faint); align-self: center; margin-right: 2px; }
  .card .nm .ic { color: var(--accent); }
  .badge { padding: 2px 7px; border-radius: 3px; font-size: 10px; font-weight: 800; letter-spacing: .5px; }

  /* ---------- filters ---------- */
  .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
  .field { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 6px 10px; font-size: 14px; outline: none; }
  .field:focus { border-color: var(--accent); }
  input.field.search { width: 300px; max-width: 100%; }
  .check { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 6px 10px; cursor: pointer; }
  .spacer { flex: 1; }
  .manage { display: flex; gap: 6px; flex-wrap: wrap; }
  .manage .btn { font-weight: 600; }

  /* ---------- table ---------- */
  .tablewrap { overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); max-height: calc(100vh - 140px); }
  table.board { border-collapse: separate; border-spacing: 0; table-layout: fixed; }
  table.board th { position: sticky; top: 0; z-index: 2; background: var(--black); color: var(--text2); font-size: 12px; font-weight: 800; letter-spacing: 1.5px; text-align: left; padding: 12px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  table.board th .rz { position: absolute; right: 0; top: 0; height: 100%; width: 8px; cursor: col-resize; }
  table.board th .rz:hover { background: rgba(0,159,227,.6); }
  table.board th.c { text-align: center; }
  table.board td { padding: 10px 12px; border-bottom: 1px solid rgba(39,39,42,.7); border-right: 1px solid rgba(39,39,42,.6); vertical-align: middle; overflow: hidden; }
  table.board tr:hover td { background: rgba(255,255,255,.02); }
  table.board tr.vor td { background: rgba(127,29,29,.22); }
  .tn { display: flex; align-items: center; gap: 8px; min-width: 0; }
  td .num { font-size: 15px; letter-spacing: .5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  td select { width: 100%; background: var(--panel2); border: 1px solid var(--line2); border-radius: 5px; padding: 8px; font-size: 14px; outline: none; }
  td select:focus { border-color: var(--accent); }
  td select.saving { border-color: var(--orange); }
  .cellbtn { width: 100%; text-align: left; background: none; border: 0; padding: 6px 0; font-size: 14px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cellbtn:hover:not(:disabled) { color: #fff; }
  .cellbtn .ph { color: var(--faint); }
  .cellinput { width: 100%; background: #27272a; border: 1px solid var(--accent); border-radius: 5px; padding: 7px 10px; font-size: 14px; outline: none; }
  td.c { text-align: center; }
  .vorbox { width: 20px; height: 20px; accent-color: var(--red); cursor: pointer; }
  .last { display: flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; }
  .last .by { font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; }
  .last .btn { padding: 3px 8px; margin-left: auto; }
  .empty { padding: 30px; text-align: center; color: var(--dim); }

  /* ---------- modals ---------- */
  .overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.72); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: 100%; max-width: 560px; max-height: 88vh; display: flex; flex-direction: column; }
  .modal.wide { max-width: 760px; }
  .modal .mh { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .modal .mh h3 { margin: 0; font-size: 14px; font-weight: 800; letter-spacing: .5px; }
  .modal .mb { padding: 16px; overflow: auto; }
  .modal .mf { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .x { background: none; border: 0; color: var(--muted); font-size: 22px; line-height: 1; padding: 0 4px; }
  .x:hover { color: #fff; }
  .form { display: grid; gap: 10px; }
  .form label { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .5px; display: grid; gap: 4px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .tab { background: var(--black); border: 1px solid var(--line); border-radius: 5px; padding: 5px 10px; font-size: 11px; font-weight: 700; }
  .tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .addrow { display: flex; gap: 8px; margin-bottom: 12px; }
  .addrow .field { flex: 1; }
  .list { display: grid; gap: 6px; }
  .li { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: rgba(39,39,42,.5); border: 1px solid var(--line); border-radius: 5px; padding: 8px 12px; font-size: 13px; }
  .li .meta { font-size: 11px; color: var(--dim); }
  .tag { font-size: 9px; font-weight: 800; padding: 2px 5px; border-radius: 3px; background: #3f3f46; margin-left: 6px; letter-spacing: .5px; }
  .tag.lock { background: rgba(0,159,227,.2); color: var(--accent); }
  .tag.guest { background: rgba(120,53,15,.6); color: #fde68a; }
  .del { background: none; border: 0; color: var(--dim); font-size: 15px; padding: 2px 6px; }
  .del:hover:not(:disabled) { color: #f87171; }
  .hist { display: grid; gap: 6px; }
  .he { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; background: rgba(39,39,42,.45); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 13px; }
  .he .f { font-size: 9px; font-weight: 800; letter-spacing: 1px; padding: 2px 6px; border-radius: 3px; background: #3f3f46; align-self: start; margin-top: 2px; }
  .he .f.Location { background: rgba(0,159,227,.25); color: #7dd3fc; }
  .he .f.Unit { background: rgba(5,150,105,.25); color: #6ee7b7; }
  .he .f.Driver { background: rgba(250,204,21,.18); color: #fde68a; }
  .he .f.Load { background: rgba(168,85,247,.2); color: #d8b4fe; }
  .he .f.VOR { background: rgba(220,38,38,.25); color: #fca5a5; }
  .he .w { color: var(--dim); font-size: 11px; grid-column: 2; }
  .note { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .note b { color: var(--text2); }

  /* ---------- full-screen panels (login, setup, loading) ---------- */
  .screen { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.94); display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: 100%; max-width: 440px; padding: 22px; }
  .panel.wide { max-width: 560px; }
  .panel h2 { margin: 0; font-size: 15px; font-weight: 800; letter-spacing: .5px; }
  .panel .sub2 { font-size: 10px; color: var(--dim); font-weight: 700; letter-spacing: 1.5px; }
  .panel .phead { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .users { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ubtn { background: var(--black); border: 1px solid var(--line); border-radius: 8px; padding: 12px; text-align: left; }
  .ubtn:hover { border-color: var(--accent); }
  .ubtn b { display: block; font-size: 13px; }
  .ubtn span { font-size: 10px; color: var(--dim); }
  .stack { display: grid; gap: 10px; }

  /* ---------- toast ---------- */
  #toast { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 300; pointer-events: none; width: calc(100% - 32px); max-width: 560px; display: flex; justify-content: center; }
  .toast { pointer-events: auto; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; padding: 10px 18px; border-radius: 99px; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
  .toast.err { background: var(--red); border-radius: 10px; }

  @media (max-width: 640px) {
    header { position: static; }
    .hdr { padding: 10px 8px; } main { padding: 8px; }
    .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    input.field.search, .searchbox { width: 100%; }
    .grp { border-right: 0; padding-right: 0; }
    .users { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="screen" class="screen"><div class="panel"><h2>Loading board…</h2></div></div>
<header id="hdr" class="hidden"></header>
<div id="banner"></div>
<main id="main" class="hidden">
  <div id="cards"></div>
  <div id="filters" class="filters"></div>
  <div id="table"></div>
</main>
<div id="modal"></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
'use strict';

/* =====================================================================
   1. SETTINGS
   ===================================================================== */
const APP_VERSION = 49.1;

const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyBeRa7qSGmmONbYmjS6ikFfcGF97h9pS9c',
  authDomain: 'sk-trailer-board.firebaseapp.com',
  projectId: 'sk-trailer-board',
  storageBucket: 'sk-trailer-board.firebasestorage.app',
  messagingSenderId: '549899352331',
  appId: '1:549899352331:web:c45f65976f1eee934d8a0e',
};

const IS_TEST = /test/i.test(location.pathname) ||
  new URLSearchParams(location.search).get('board') === 'test';
const BOARD_ID = IS_TEST ? 'test' : 'live';

const TYPES = {
  'Double Decker': { label: 'DOUBLE',   color: '#e11d48', text: '#fff' },
  'Straight':      { label: 'STRAIGHT', color: '#059669', text: '#fff' },
  'Urban':         { label: 'URBAN',    color: '#facc15', text: '#000' },
  'Other':         { label: 'OTHER',    color: '#71717a', text: '#fff' },
};

const HOME = 'Our Yard';                 // can't be deleted; moving here un-hitches unit + driver
const HISTORY_LIMIT = 50;                // history entries kept per trailer
const AUTO_BACKUP_EVERY = 3600e3;        // one automatic cloud backup every hour (shared by everyone)
const AUTO_BACKUP_KEEP = 30;             // newest 30 automatic backups kept (30+ hours)
const MANUAL_BACKUP_KEEP = 30;           // newest 30 "Backup to Cloud" backups kept
const DEFAULT_USERS = [
  { id: 'us1', name: 'Mathew' },
  { id: 'guest', name: 'Guest', role: 'guest' },
];
const DEFAULT_COLS = { trailer: 230, location: 190, unit: 185, driver: 170, load: 220, notes: 400, vor: 72, hist: 330 };
const LS_USER = 'sk_user_v49_' + BOARD_ID;
const LS_COLS = 'sk_cols_v49';

/* =====================================================================
   2. SMALL HELPERS
   ===================================================================== */
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = (s) => String(s ?? '').trim().toLowerCase();
const same = (a, b) => norm(a) === norm(b);
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const fmtDate = (ms = Date.now()) => new Date(ms).toLocaleString('en-GB', {
  day: '2-digit', month: '2-digit', year: 'numeric',
  hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
});
// "09/10/2026, 22:51:11" -> milliseconds (for old history entries that have no ts)
function parseGB(str) {
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4}),?\s*(\d{1,2}):(\d{2})(?::(\d{2}))?/.exec(str || '');
  return m ? new Date(+m[3], m[2] - 1, +m[1], +m[4], +m[5], +(m[6] || 0)).getTime() : 0;
}
const entryTime = (e) => e.ts || parseGB(e.date);

const ls = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

function download(filename, text, type = 'application/json') {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1000);
}

function withTimeout(promise, ms = 15000) {
  return Promise.race([promise, new Promise((_, rej) => setTimeout(() =>
    rej(Object.assign(new Error('No reply from the server — check your connection. The change may not have saved; check the board before trying again.'), { code: 'timeout' })), ms))]);
}

function friendlyError(e) {
  const code = String((e && e.code) || '');
  if (code.includes('permission-denied'))
    return 'Firebase refused this (permission denied). The database rules need updating — see the setup notes.';
  if (code.includes('unavailable') || code.includes('failed-precondition'))
    return 'No connection to the server — nothing was saved. Try again once back online.';
  if (code.includes('aborted'))
    return 'Someone else changed this at the same moment — please try again.';
  return (e && e.message) || String(e);
}

/* =====================================================================
   3. CLEANING DATA (makes old/odd records safe to use)
   ===================================================================== */
function cleanTrailer(t, i = 0) {
  return {
    id: String(t.id || newId()),
    number: String(t.number || '').trim().toUpperCase(),
    type: TYPES[t.type] ? t.type : 'Other',
    location: String(t.location || HOME).trim(),
    unit: String(t.unit || '').trim(),
    driver: String(t.driver || '').trim(),
    load: String(t.load || '').trim(),
    notes: String(t.notes || '').trim(),
    vor: !!t.vor,
    history: Array.isArray(t.history) ? t.history.filter(Boolean).slice(0, HISTORY_LIMIT) : [],
    order: Number.isFinite(t.order) ? t.order : i * 10,
    updatedAt: t.updatedAt || 0,
  };
}
const byOrder = (a, b) => (a.order - b.order) || a.number.localeCompare(b.number, undefined, { numeric: true });

function dedupe(list, key) {
  const seen = new Set(), out = [];
  for (const x of list || []) {
    const k = norm(x && x[key]);
    if (!k || seen.has(k)) continue;
    seen.add(k); out.push(x);
  }
  return out;
}
function cleanLocations(list) {
  let locs = dedupe((list || []).map((l) => ({ id: String(l.id || newId()), name: String(l.name || '').trim() })), 'name');
  if (!locs.some((l) => same(l.name, HOME))) locs.unshift({ id: 'l_home', name: HOME });
  return locs;
}
const cleanUnits = (list) => dedupe((list || []).map((u) => ({ id: String(u.id || newId()), reg: String(u.reg || '').trim().toUpperCase() })), 'reg');
const cleanDrivers = (list) => dedupe((list || [])
  .filter((d) => d && d.id !== 'no-driver' && !same(d.name, 'No driver'))
  .map((d) => ({ id: String(d.id || newId()), name: String(d.name || '').trim() })), 'name');
const cleanUsers = (list) => dedupe((list || []).map((u) => ({
  id: String(u.id || newId()), name: String(u.name || '').trim(), ...(u.role === 'guest' ? { role: 'guest' } : {}),
})), 'name');

function cleanMeta(m) {
  m = m || {};
  const users = cleanUsers(m.users);
  return {
    locations: cleanLocations(m.locations),
    units: cleanUnits(m.units),
    drivers: cleanDrivers(m.drivers),
    users: users.length ? users : DEFAULT_USERS,
    lastAutoBackupMs: m.lastAutoBackupMs || 0,
    minAppVersion: m.minAppVersion || 0,
  };
}

/* =====================================================================
   4. STATE
   ===================================================================== */
const S = {
  phase: 'loading',        // loading | error | setup | login | ready
  error: '',
  metaExists: null,        // null = not known yet
  meta: cleanMeta({}),
  trailers: [],
  trailersLoaded: false,
  metaFromCache: true,
  trailersFromCache: true,
  user: '',
  remember: true,
  filters: { search: '', location: '', type: '', vorOnly: false },
  editing: null,           // { id, field } while typing in Load / Notes
  pending: {},             // { trailerId: { field: value } } shown while a save is in flight
  modal: null,             // { kind: ..., ... }
  toast: null,
  cols: { ...DEFAULT_COLS },
};
try { Object.assign(S.cols, JSON.parse(ls.get(LS_COLS) || '{}')); } catch {}

const isOnline = () => !S.metaFromCache && !S.trailersFromCache && navigator.onLine;
const tooOld = () => S.meta.minAppVersion > APP_VERSION;
const canEdit = () => S.phase === 'ready' && isOnline() && !!S.user && !tooOld();

/* =====================================================================
   5. FIREBASE
   ===================================================================== */
let db, metaRef, trailersCol, backupsCol;

function startFirebase() {
  if (!window.firebase || !firebase.firestore) {
    return fatal('Could not load Firebase. Check the internet connection and refresh the page.');
  }
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  metaRef = db.collection('boards').doc(BOARD_ID);
  trailersCol = metaRef.collection('trailers');
  backupsCol = metaRef.collection('backups');

  let subscribed = false;
  firebase.auth().onAuthStateChanged((u) => {
    if (!u) {
      firebase.auth().signInAnonymously().catch((e) => fatal('Could not sign in to Firebase: ' + friendlyError(e)));
      return;
    }
    if (subscribed) return;
    subscribed = true;
    subscribe();
  });
}

function subscribe() {
  metaRef.onSnapshot({ includeMetadataChanges: true }, (snap) => {
    S.metaFromCache = snap.metadata.fromCache;
    // Only trust "doesn't exist" once the server has actually answered.
    if (snap.exists || !snap.metadata.fromCache) {
      S.metaExists = snap.exists;
      if (snap.exists) S.meta = cleanMeta(snap.data());
    }
    updatePhase();
  }, (e) => fatal('Lost access to the board: ' + friendlyError(e)));

  trailersCol.onSnapshot({ includeMetadataChanges: true }, (qs) => {
    S.trailersFromCache = qs.metadata.fromCache;
    S.trailers = qs.docs.map((d) => cleanTrailer({ ...d.data(), id: d.id })).sort(byOrder);
    S.trailersLoaded = true;
    updatePhase();
  }, (e) => fatal('Lost access to the trailers: ' + friendlyError(e)));
}

function updatePhase() {
  if (S.phase === 'error') return render();
  if (S.metaExists === null || !S.trailersLoaded) S.phase = 'loading';
  else if (S.metaExists === false) S.phase = 'setup';
  else {
    // logged-in user removed from the list? -> log out
    if (S.user && !S.meta.users.some((u) => u.name === S.user)) S.user = '';
    if (!S.user) {
      const saved = ls.get(LS_USER);
      if (saved && S.meta.users.some((u) => u.name === saved)) S.user = saved;
    }
    S.phase = S.user ? 'ready' : 'login';
  }
  render();
}

function fatal(msg) { S.phase = 'error'; S.error = msg; render(true); }

/* ---------- writing: everything below goes through transactions ---------- */

// Edit one or more trailers safely. `plan(fresh)` gets the LATEST copies from
// the server and returns { id: { changes: {...}, entries: [{field, from, to}] } }.
function editTrailers(ids, plan) {
  const user = S.user;
  return withTimeout(db.runTransaction(async (tx) => {
    const refs = ids.map((id) => trailersCol.doc(id));
    const fresh = {};
    for (let i = 0; i < refs.length; i++) {
      const snap = await tx.get(refs[i]);
      if (!snap.exists) throw new Error('That trailer no longer exists — someone may have deleted it.');
      fresh[ids[i]] = cleanTrailer({ ...snap.data(), id: ids[i] });
    }
    const p = plan(fresh) || {};
    const now = Date.now();
    let written = 0;
    for (const id of ids) {
      const step = p[id];
      if (!step || !Object.keys(step.changes || {}).length) continue;
      const entries = (step.entries || []).map((e) => ({ ...e, user, date: fmtDate(now), ts: now }));
      tx.update(refs[ids.indexOf(id)], {
        ...step.changes,
        history: [...entries, ...fresh[id].history].slice(0, HISTORY_LIMIT),
        updatedAt: now,
        updatedBy: user,
      });
      written++;
    }
    return written;
  }));
}

// Edit the shared lists (locations, units, drivers, users) safely.
function editMeta(fn) {
  return withTimeout(db.runTransaction(async (tx) => {
    const snap = await tx.get(metaRef);
    const m = cleanMeta(snap.data());
    const changes = fn(m);
    if (changes) tx.set(metaRef, { ...changes, updatedAt: Date.now() }, { merge: true });
  }));
}

// Read the whole board straight from the server (for backups).
async function readBoardFromServer() {
  const [m, qs] = await withTimeout(Promise.all([metaRef.get({ source: 'server' }), trailersCol.get({ source: 'server' })]));
  return { meta: cleanMeta(m.data()), trailers: qs.docs.map((d) => cleanTrailer({ ...d.data(), id: d.id })).sort(byOrder) };
}

function backupPayload(board, type, ms) {
  // Same shape as the old v48 backups, so old and new files are interchangeable.
  return {
    trailers: board.trailers,
    locations: board.meta.locations,
    units: board.meta.units,
    drivers: board.meta.drivers,
    users: board.meta.users,
    backupAt: fmtDate(ms),
    backupAtMs: ms,
    trailerCount: board.trailers.length,
    type,
    by: S.user || '',
    board: BOARD_ID,
    version: APP_VERSION,
  };
}

async function saveBackup(type) {
  const ms = Date.now();
  const data = backupPayload(await readBoardFromServer(), type, ms);
  await withTimeout(backupsCol.doc(`${type}_${ms}`).set(data));
  return data;
}

// Replace the whole board with `data` (used for setup, restore, load file).
async function writeWholeBoard(data, extraMeta = {}) {
  const trailers = (data.trailers || []).map((t, i) => cleanTrailer(t, i));
  const metaPatch = {
    locations: cleanLocations(data.locations),
    units: cleanUnits(data.units),
    drivers: cleanDrivers(data.drivers),
    updatedAt: Date.now(),
    ...extraMeta,
  };
  if (data.users && data.users.length) metaPatch.users = cleanUsers(data.users);
  // Make sure every location used by a trailer is in the list.
  for (const t of trailers) {
    if (!metaPatch.locations.some((l) => same(l.name, t.location))) metaPatch.locations.push({ id: newId(), name: t.location });
  }
  const existing = await withTimeout(trailersCol.get({ source: 'server' }));
  const keep = new Set(trailers.map((t) => t.id));
  const ops = [
    (b) => b.set(metaRef, metaPatch, { merge: true }),
    ...trailers.map((t) => (b) => b.set(trailersCol.doc(t.id), t)),
    ...existing.docs.filter((d) => !keep.has(d.id)).map((d) => (b) => b.delete(d.ref)),
  ];
  for (let i = 0; i < ops.length; i += 400) {
    const batch = db.batch();
    ops.slice(i, i + 400).forEach((op) => op(batch));
    await withTimeout(batch.commit(), 30000);
  }
  return trailers.length;
}

/* =====================================================================
   6. ACTIONS (what the buttons do)
   ===================================================================== */
let toastTimer = null;
function toast(msg, err = false) {
  S.toast = { msg, err };
  renderToast();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { S.toast = null; renderToast(); }, err ? 7000 : 3500);
}

function guard() {
  if (S.phase !== 'ready' || !S.user) { toast('Please log in first', true); return false; }
  if (tooOld()) { toast('This page is out of date — please refresh', true); return false; }
  if (!isOnline()) { toast('No connection — the board is read-only until it reconnects', true); return false; }
  return true;
}

// Run a save, showing the new value straight away and undoing it if it fails.
async function saving(id, field, value, work, okMsg) {
  if (!guard()) { invalidate(); return render(true); }
  S.pending[id] = { ...(S.pending[id] || {}), [field]: value };
  render(true);
  try {
    const n = await work();
    if (okMsg && n !== 0) toast(okMsg);
  } catch (e) {
    toast(friendlyError(e), true);
  } finally {
    if (S.pending[id]) { delete S.pending[id][field]; if (!Object.keys(S.pending[id]).length) delete S.pending[id]; }
    invalidate();
    render();
  }
}

const findTrailer = (id) => S.trailers.find((t) => t.id === id);

function moveTrailer(id, loc) {
  const t = findTrailer(id); if (!t || t.location === loc) return;
  const home = same(loc, HOME);
  saving(id, 'location', loc, () => editTrailers([id], (f) => {
    const x = f[id];
    if (x.location === loc) return null;
    const detach = home && (x.unit || x.driver);
    const changes = { location: loc }, entries = [{ field: 'Location', from: x.location, to: detach ? loc + ' (auto de-attach)' : loc }];
    if (home && x.unit) { changes.unit = ''; entries.push({ field: 'Unit', from: 'Unit: ' + x.unit, to: 'Unit: -' }); }
    if (home && x.driver) { changes.driver = ''; entries.push({ field: 'Driver', from: 'Driver: ' + x.driver, to: 'Driver: -' }); }
    return { [id]: { changes, entries } };
  }), home && (t.unit || t.driver) ? `Moved ${t.number} → ${loc} • unit/driver un-hitched` : `Moved ${t.number}: ${t.location} → ${loc}`);
}

function setUnit(id, reg) {
  const t = findTrailer(id); if (!t || t.unit === reg) return;
  const others = reg ? S.trailers.filter((x) => x.id !== id && x.unit === reg) : [];
  if (others.length && !confirm(`${reg} is attached to ${others.map((o) => o.number).join(', ')}.\n\nMove it to ${t.number} instead?`)) { invalidate(); return render(true); }
  const ids = [id, ...others.map((o) => o.id)];
  saving(id, 'unit', reg, () => editTrailers(ids, (f) => {
    const out = {};
    if (f[id].unit !== reg) out[id] = { changes: { unit: reg }, entries: [{ field: 'Unit', from: 'Unit: ' + (f[id].unit || '-'), to: 'Unit: ' + (reg || '-') }] };
    for (const o of ids.slice(1)) {
      if (f[o].unit === reg) out[o] = { changes: { unit: '' }, entries: [{ field: 'Unit', from: 'Unit: ' + reg, to: 'Unit: - (moved to ' + f[id].number + ')' }] };
    }
    return out;
  }), `Unit ${t.number}: ${t.unit || '-'} → ${reg || '-'}`);
}

function setDriver(id, name) {
  const t = findTrailer(id); if (!t || t.driver === name) return;
  saving(id, 'driver', name, () => editTrailers([id], (f) => f[id].driver === name ? null : {
    [id]: { changes: { driver: name }, entries: [{ field: 'Driver', from: 'Driver: ' + (f[id].driver || '-'), to: 'Driver: ' + (name || '-') }] },
  }), `Driver ${t.number}: ${t.driver || '-'} → ${name || '-'}`);
}

function setText(id, field, value) {
  const t = findTrailer(id); value = value.trim();
  if (!t || t[field] === value) return;
  const label = field === 'load' ? 'Load' : 'Notes';
  saving(id, field, value, () => editTrailers([id], (f) => f[id][field] === value ? null : {
    [id]: { changes: { [field]: value }, entries: [{ field: label, from: `${label}: ${f[id][field] || '-'}`, to: `${label}: ${value || '-'}` }] },
  }), `${label} saved for ${t.number}`);
}

function setVor(id, on) {
  const t = findTrailer(id); if (!t || t.vor === on) return;
  saving(id, 'vor', on, () => editTrailers([id], (f) => {
    const x = f[id]; if (x.vor === on) return null;
    const changes = { vor: on }, entries = [{ field: 'VOR', from: 'VOR: ' + (x.vor ? 'Yes' : 'No'), to: 'VOR: ' + (on ? 'Yes' : 'No') }];
    if (on && x.unit) { changes.unit = ''; entries.push({ field: 'Unit', from: 'Unit: ' + x.unit, to: 'Unit: -' }); }
    if (on && x.driver) { changes.driver = ''; entries.push({ field: 'Driver', from: 'Driver: ' + x.driver, to: 'Driver: -' }); }
    return { [id]: { changes, entries } };
  }), on ? `${t.number} marked VOR` : `${t.number} back in service`);
}

async function addTrailer(number, type, location) {
  number = number.trim().toUpperCase();
  if (!number) return toast('Enter a trailer number', true);
  if (S.trailers.some((t) => t.number === number)) return toast(number + ' already exists', true);
  if (!guard()) return;
  const id = 'n_' + number.replace(/[^A-Z0-9]/g, '_');
  const order = S.trailers.reduce((m, t) => Math.max(m, t.order), 0) + 10;
  const now = Date.now();
  const t = cleanTrailer({ id, number, type, location, order, updatedAt: now,
    history: [{ field: 'Location', from: 'Created', to: location, user: S.user, date: fmtDate(now), ts: now }] });
  try {
    await withTimeout(db.runTransaction(async (tx) => {
      const snap = await tx.get(trailersCol.doc(id));
      if (snap.exists) throw new Error(number + ' already exists');
      tx.set(trailersCol.doc(id), t);
    }));
    S.modal = null; render(true);
    toast('Added ' + number);
  } catch (e) { toast(friendlyError(e), true); }
}

async function deleteTrailer(id) {
  const t = findTrailer(id); if (!t || !guard()) return;
  if (!confirm(`Delete trailer ${t.number} and all its history?\n\nThis can only be undone by restoring a backup.`)) return;
  try { await withTimeout(trailersCol.doc(id).delete()); toast('Deleted ' + t.number); }
  catch (e) { toast(friendlyError(e), true); }
}

async function metaAction(fn, okMsg) {
  if (!guard()) return;
  try { await editMeta(fn); if (okMsg) toast(okMsg); render(true); }
  catch (e) { toast(friendlyError(e), true); }
}

const MANAGE = {
  units: {
    add: (v) => metaAction((m) => {
      const reg = v.toUpperCase();
      if (m.units.some((u) => u.reg === reg)) throw new Error(reg + ' is already in the list');
      return { units: [...m.units, { id: newId(), reg }] };
    }, 'Added unit ' + v.toUpperCase()),
    remove: (id) => metaAction((m) => {
      const u = m.units.find((x) => x.id === id); if (!u) return null;
      const used = S.trailers.filter((t) => t.unit === u.reg);
      if (used.length) throw new Error(`Can't remove ${u.reg} — attached to ${used.map((t) => t.number).join(', ')}`);
      return { units: m.units.filter((x) => x.id !== id) };
    }, 'Unit removed'),
  },
  drivers: {
    add: (v) => metaAction((m) => {
      if (m.drivers.some((d) => same(d.name, v))) throw new Error(v + ' is already in the list');
      return { drivers: [...m.drivers, { id: newId(), name: v }] };
    }, 'Added driver ' + v),
    remove: (id) => metaAction((m) => {
      const d = m.drivers.find((x) => x.id === id); if (!d) return null;
      const used = S.trailers.filter((t) => t.driver === d.name);
      if (used.length) throw new Error(`Can't remove ${d.name} — on ${used.map((t) => t.number).join(', ')}`);
      return { drivers: m.drivers.filter((x) => x.id !== id) };
    }, 'Driver removed'),
  },
  locations: {
    add: (v) => metaAction((m) => {
      if (m.locations.some((l) => same(l.name, v))) throw new Error(v + ' already exists');
      return { locations: [...m.locations, { id: newId(), name: v }] };
    }, 'Added location ' + v),
    remove: (id) => metaAction((m) => {
      const l = m.locations.find((x) => x.id === id); if (!l) return null;
      if (same(l.name, HOME)) throw new Error(HOME + " can't be removed");
      const n = S.trailers.filter((t) => same(t.location, l.name)).length;
      if (n) throw new Error(`Can't remove ${l.name} — ${n} trailer(s) there`);
      return { locations: m.locations.filter((x) => x.id !== id) };
    }, 'Location removed'),
  },
  users: {
    add: (v) => metaAction((m) => {
      if (m.users.some((u) => same(u.name, v))) throw new Error(v + ' already exists');
      return { users: [...m.users, { id: newId(), name: v }] };
    }, 'Added user ' + v),
    remove: (id) => metaAction((m) => {
      const u = m.users.find((x) => x.id === id); if (!u) return null;
      if (u.name === S.user) throw new Error("You can't remove yourself while logged in");
      if (m.users.length <= 1) throw new Error('At least one user is needed');
      return { users: m.users.filter((x) => x.id !== id) };
    }, 'User removed'),
  },
};

/* ---------- backups ---------- */
async function doCloudBackup() {
  if (!guard()) return;
  toast('Saving backup to the cloud…');
  try {
    const data = await saveBackup('manual');
    toast(`Backup saved to the cloud • ${data.trailerCount} trailers`);
    await pruneBackups().catch(() => {});
    if (S.modal && S.modal.kind === 'backups') openBackups();
  } catch (e) { toast('Backup failed: ' + friendlyError(e), true); }
}

async function doSaveToPc() {
  try {
    const d = backupPayload(await readBoardFromServer(), 'file', Date.now());
    const stamp = new Date(d.backupAtMs);
    const pad = (n) => String(n).padStart(2, '0');
    download(`SK_BOARD_${IS_TEST ? 'TEST_' : ''}${stamp.getFullYear()}-${pad(stamp.getMonth() + 1)}-${pad(stamp.getDate())}_${pad(stamp.getHours())}${pad(stamp.getMinutes())}.json`, JSON.stringify(d, null, 2));
    toast(`Board saved to file • ${d.trailerCount} trailers`);
  } catch (e) { toast('Could not save file: ' + friendlyError(e), true); }
}

async function maybeAutoBackup() {
  if (!canEdit() || !S.trailers.length) return;
  if (Date.now() - S.meta.lastAutoBackupMs < AUTO_BACKUP_EVERY) return;
  try {
    // Claim the job so that only one open screen makes the backup.
    const claimed = await withTimeout(db.runTransaction(async (tx) => {
      const snap = await tx.get(metaRef);
      if (Date.now() - ((snap.data() || {}).lastAutoBackupMs || 0) < AUTO_BACKUP_EVERY) return false;
      tx.update(metaRef, { lastAutoBackupMs: Date.now() });
      return true;
    }));
    if (!claimed) return;
    await saveBackup('auto');
    await pruneBackups();
  } catch (e) { console.warn('auto backup failed', e); }
}

async function pruneBackups() {
  const qs = await backupsCol.orderBy('backupAtMs', 'desc').limit(400).get();
  const all = qs.docs.map((d) => ({ ref: d.ref, ...d.data() }));
  const doomed = [
    ...all.filter((b) => b.type === 'auto').slice(AUTO_BACKUP_KEEP),
    ...all.filter((b) => b.type === 'manual').slice(MANUAL_BACKUP_KEEP),
    ...all.filter((b) => b.type === 'pre-restore').slice(10),
  ];
  for (const b of doomed) await b.ref.delete().catch(() => {});
}

async function openBackups() {
  S.modal = { kind: 'backups', list: null, old: null };
  render(true);
  try {
    const qs = await withTimeout(backupsCol.orderBy('backupAtMs', 'desc').limit(80).get());
    if (S.modal && S.modal.kind === 'backups') { S.modal.list = qs.docs.map((d) => ({ id: d.id, ...d.data() })); render(true); }
  } catch (e) {
    if (S.modal && S.modal.kind === 'backups') { S.modal.list = []; S.modal.err = friendlyError(e); render(true); }
  }
}

async function loadOldBackups() {
  try {
    const qs = await withTimeout(db.collection('yard_backups').orderBy('backupAtMs', 'desc').limit(40).get());
    if (S.modal && S.modal.kind === 'backups') { S.modal.old = qs.docs.map((d) => ({ id: d.id, ...d.data() })); render(true); }
  } catch (e) { toast('Could not load old backups: ' + friendlyError(e), true); }
}

function findBackup(src, id) {
  const list = (src === 'old' ? S.modal.old : S.modal.list) || [];
  return list.find((b) => b.id === id);
}

async function restoreBoard(data, label) {
  if (!guard()) return;
  const n = (data.trailers || []).length;
  if (!n) return toast('That backup has no trailers in it — not restoring', true);
  if (!confirm(`Restore ${label}?\n\n${n} trailers. This REPLACES the whole ${IS_TEST ? 'TEST' : 'LIVE'} board for everyone.\n\n(A safety backup of the board as it is now is taken first.)`)) return;
  try {
    toast('Taking safety backup…');
    if (S.trailers.length) await saveBackup('pre-restore');
    toast('Restoring…');
    await writeWholeBoard(data);
    S.modal = null; render(true);
    toast(`Restored ${n} trailers from ${label}`);
  } catch (e) { toast('Restore failed: ' + friendlyError(e), true); }
}

function readJsonFile(input) {
  return new Promise((resolve, reject) => {
    const f = input.files && input.files[0];
    input.value = '';
    if (!f) return reject(new Error('No file chosen'));
    f.text().then((txt) => {
      try {
        const d = JSON.parse(txt);
        if (!Array.isArray(d.trailers)) throw new Error('no trailers list');
        resolve({ data: d, name: f.name });
      } catch (e) { reject(new Error("That file isn't a board backup (" + e.message + ')')); }
    }, reject);
  });
}

/* ---------- first-time setup ---------- */
async function setupFromOld() {
  try {
    toast('Reading the current board…');
    const snap = await withTimeout(db.collection('yard').doc('main').get({ source: 'server' }));
    if (!snap.exists) return toast('Could not find the old board (yard/main)', true);
    const d = snap.data();
    const n = (d.trailers || []).length;
    if (!confirm(`Copy the current board into this ${IS_TEST ? 'TEST' : 'LIVE'} board?\n\n${n} trailers, ${(d.locations || []).length} locations, ${(d.units || []).length} units, ${(d.drivers || []).length} drivers.\n\nThe old board itself is not changed.`)) return;
    await writeWholeBoard(d, { createdAt: Date.now(), createdFrom: 'yard/main', minAppVersion: APP_VERSION,
      users: cleanUsers(d.users).length ? cleanUsers(d.users) : DEFAULT_USERS });
    toast(`Copied ${n} trailers`);
  } catch (e) { toast('Copy failed: ' + friendlyError(e), true); }
}

async function setupFromFile(input) {
  try {
    const { data, name } = await readJsonFile(input);
    if (!confirm(`Set up this ${IS_TEST ? 'TEST' : 'LIVE'} board from ${name}?\n\n${data.trailers.length} trailers.`)) return;
    await writeWholeBoard(data, { createdAt: Date.now(), createdFrom: name, minAppVersion: APP_VERSION,
      users: cleanUsers(data.users).length ? cleanUsers(data.users) : DEFAULT_USERS });
    toast(`Loaded ${data.trailers.length} trailers from ${name}`);
  } catch (e) { toast(friendlyError(e), true); }
}

/* =====================================================================
   7. WHAT TO SHOW
   ===================================================================== */
function view(t) { return { ...t, ...(S.pending[t.id] || {}) }; }

function visibleTrailers() {
  const f = S.filters, q = norm(f.search);
  return S.trailers.map(view).filter((t) => {
    if (f.location && !same(t.location, f.location)) return false;
    if (f.type && t.type !== f.type) return false;
    if (f.vorOnly && !t.vor) return false;
    if (q && !norm([t.number, t.type, t.location, t.unit, t.driver, t.load, t.notes].join(' ')).includes(q)) return false;
    return true;
  });
}

// Locations to show: the list, plus any location a trailer is at that isn't on the list.
function allLocations() {
  const locs = [...S.meta.locations];
  for (const t of S.trailers) if (!locs.some((l) => same(l.name, t.location))) locs.push({ id: 'x_' + t.location, name: t.location, extra: true });
  return locs.sort((a, b) => same(a.name, HOME) ? -1 : same(b.name, HOME) ? 1 : a.name.localeCompare(b.name));
}

function countTypes(list) {
  const c = {};
  for (const t of list) c[t.type] = (c[t.type] || 0) + 1;
  return Object.keys(TYPES).filter((k) => c[k]).map((k) => [k, c[k]]);
}

function typeChips(list) {
  return countTypes(list).map(([k, n]) => `<span class="chip"><span class="d" style="background:${TYPES[k].color}"></span>${TYPES[k].label}: ${n}</span>`).join('');
}

function boardHistory() {
  const out = [];
  for (const t of S.trailers) for (const e of t.history) out.push({ ...e, trailerNo: t.number, trailerId: t.id });
  return out.sort((a, b) => entryTime(b) - entryTime(a));
}

// Old entries had no "field" -> they were location moves.
function entryField(e) {
  if (e.field) return e.field;
  const f = String(e.from || '');
  for (const k of ['Unit', 'Driver', 'Load', 'Notes', 'VOR']) if (f.startsWith(k + ':')) return k;
  return 'Location';
}
const HIST_FILTERS = ['All', 'Location', 'Unit', 'Driver', 'Load', 'Notes', 'VOR'];

/* =====================================================================
   8. RENDERING
   Each part of the page is redrawn separately. A part is NOT redrawn while
   you're typing/choosing in it (so live updates from other people never
   wipe what you're doing) - it catches up as soon as you click away.
   ===================================================================== */
const dirty = new Set();
function setHTML(el, html, force) {
  const a = document.activeElement;
  if (!force && a && el.contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) { dirty.add(el.id); return; }
  dirty.delete(el.id);
  if (el._last === html) return;
  const scrolls = [...el.querySelectorAll('.tablewrap, .mb')].map((x) => [x.className, x.scrollTop, x.scrollLeft]);
  el.innerHTML = html; el._last = html;
  for (const [cls, top, left] of scrolls) {
    const x = el.querySelector('.' + cls.split(' ')[0]);
    if (x) { x.scrollTop = top; x.scrollLeft = left; }
  }
}
// Forget what was drawn, so the next draw resets any dropdown/checkbox the
// user changed but which didn't save.
function invalidate() { for (const id of ['table', 'cards', 'filters', 'modal']) { const el = document.getElementById(id); if (el) el._last = null; } }
document.addEventListener('focusout', () => setTimeout(() => { if (dirty.size) render(); }, 0));

let rafPending = false, forcePending = false;
function render(force = false) {
  forcePending = forcePending || force;
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => { rafPending = false; const f = forcePending; forcePending = false; draw(f); });
}

function draw(force) {
  const screen = $('#screen');
  const ready = S.phase === 'ready';
  screen.classList.toggle('hidden', ready);
  $('#hdr').classList.toggle('hidden', !ready);
  $('#main').classList.toggle('hidden', !ready);
  if (!ready) {
    setHTML(screen, drawScreen(), true);
    setHTML($('#modal'), '', true);
    setHTML($('#banner'), '', true);
    return;
  }
  $('#hdr').className = IS_TEST ? 'test' : '';
  setHTML($('#hdr'), drawHeader(), force);
  setHTML($('#banner'), drawBanner(), force);
  setHTML($('#cards'), drawCards(), force);
  setHTML($('#filters'), drawFilters(), force);
  setHTML($('#table'), drawTable(), force);
  setHTML($('#modal'), drawModal(), force);
  if (S.editing) {
    const inp = $('#editbox');
    if (inp && document.activeElement !== inp) { inp.focus(); inp.select(); }
  }
  const focusMe = $('#modal [data-autofocus]');
  if (focusMe && !focusMe._focused) { focusMe._focused = true; focusMe.focus(); }
}

  $('#toast').innerHTML = S.toast ? `<div class="toast ${S.toast.err ? 'err' : ''}">${esc(S.toast.msg)}</div>` : '';

/* ---------- main table ---------- */
const COLS = [
  ['trailer', 'TRAILER / TYPE'], ['location', 'LOCATION'], ['unit', 'ATTACHED UNIT'], ['driver', 'DRIVER'],
  ['load', 'LOAD / DESTINATION'], ['notes', 'NOTES'], ['vor', 'VOR'], ['hist', 'LAST UPDATED'],
];

function options(list, current, blankLabel, extra = () => '') {
  const names = list.slice();
  if (current && !names.includes(current)) names.unshift(current);   // keep odd old values visible
  return `<option value="">${blankLabel}</option>` + names.map((n) =>
    `<option value="${esc(n)}" ${n === current ? 'selected' : ''}>${esc(n)}${extra(n)}</option>`).join('');
}

function drawTable() {
  const rows = visibleTrailers();
  const edit = canEdit();
  const width = Object.values(S.cols).reduce((a, b) => a + b, 0);
  const unitOn = {}, driverOn = {};
  for (const t of S.trailers) { if (t.unit) (unitOn[t.unit] = unitOn[t.unit] || []).push(t.number); if (t.driver) (driverOn[t.driver] = driverOn[t.driver] || []).push(t.number); }
  const locNames = allLocations().map((l) => l.name);

  const body = rows.map((t) => {
    const p = S.pending[t.id] || {};
    const border = t.vor ? 'var(--red)' : TYPES[t.type].color;
    const ty = TYPES[t.type];
    const last = t.history[0];
    const ed = S.editing && S.editing.id === t.id ? S.editing.field : null;
    const textCell = (field, ph) => ed === field
      ? `<input id="editbox" class="cellinput" value="${esc(S.editing.draft)}" data-edit="${field}" data-id="${t.id}" maxlength="300">`
      : `<button class="cellbtn" data-click="edit" data-field="${field}" data-id="${t.id}" ${edit ? '' : 'disabled'} title="${esc(t[field])}">${t[field] ? esc(t[field]) : `<span class="ph">${field === 'load' ? 'Click to set load' : 'Click to add note'}</span>`}</button>`;
    return `<tr class="${t.vor ? 'vor' : ''}">
      <td style="border-left:4px solid ${border}"><div class="tn"><span class="num mono">${esc(t.number)}</span>
        <span class="badge" style="background:${ty.color};color:${ty.text}">${ty.label}</span>
        ${t.vor ? '<span class="badge" style="background:var(--red);color:#fff">VOR</span>' : ''}</div></td>
      <td><select data-change="loc" data-id="${t.id}" class="${'location' in p ? 'saving' : ''}" ${edit ? '' : 'disabled'}>
        ${options(locNames, t.location, '—').replace('<option value="">—</option>', '')}</select></td>
      <td><select data-change="unit" data-id="${t.id}" class="${'unit' in p ? 'saving' : ''}" ${edit && !t.vor ? '' : 'disabled'}>
        ${options(S.meta.units.map((u) => u.reg), t.unit, t.vor ? 'VOR - disabled' : 'No unit',
          (n) => { const on = (unitOn[n] || []).filter((x) => x !== t.number); return on.length ? ' (on ' + esc(on.join(', ')) + ')' : ''; })}</select></td>
      <td><select data-change="driver" data-id="${t.id}" class="${'driver' in p ? 'saving' : ''}" ${edit && !t.vor ? '' : 'disabled'}>
        ${options(S.meta.drivers.map((d) => d.name), t.driver, t.vor ? 'VOR - disabled' : 'No driver',
          (n) => { const on = (driverOn[n] || []).filter((x) => x !== t.number); return on.length ? ' (on ' + esc(on.join(', ')) + ')' : ''; })}</select></td>
      <td>${textCell('load')}</td>
      <td>${textCell('notes')}</td>
      <td class="c"><input type="checkbox" class="vorbox" data-change="vor" data-id="${t.id}" ${t.vor ? 'checked' : ''} ${edit ? '' : 'disabled'} title="Vehicle off road"></td>
      <td><div class="last">${last ? `<span>${esc(last.date)}</span><span class="by">by ${esc(last.user || '-')}</span>` : '<span class="ph">No moves</span>'}
        <button class="btn" data-click="thistory" data-id="${t.id}" title="History">${icon('clock', 12)} ${t.history.length}</button></div></td>
    </tr>`;
  }).join('');

  return `<div class="tablewrap"><table class="board" style="width:${width}px">
    <colgroup>${COLS.map(([k]) => `<col data-col="${k}" style="width:${S.cols[k]}px">`).join('')}</colgroup>
    <thead><tr>${COLS.map(([k, label]) => `<th class="${k === 'vor' ? 'c' : ''}" style="position:sticky">${label}<span class="rz" data-resize="${k}" title="Drag to resize"></span></th>`).join('')}</tr></thead>
    <tbody>${body || `<tr><td colspan="8" class="empty">${S.trailers.length ? 'No trailers match these filters.' : 'No trailers yet — use ADD TRAILER.'}</td></tr>`}</tbody>
  </table></div>`;
}

    body = `<p class="note">Add new trailers with the <b>ADD TRAILER</b> button. Deleting removes the trailer and its history.</p><div class="list">
      ${S.trailers.map((t) => `<div class="li"><span><span class="mono">${esc(t.number)}</span> <span class="meta">• ${esc(t.type)} • ${esc(t.location)}</span></span>
        <button class="del" data-click="del-trailer" data-id="${t.id}" ${edit} title="Delete">${icon('trash')}</button></div>`).join('')}</div>`;
  } else {
    const cfg = {
      units: { ph: 'New unit reg, e.g. PN74 FNM', items: S.meta.units.map((u) => ({ id: u.id, name: u.reg, info: S.trailers.filter((t) => t.unit === u.reg).map((t) => t.number) })) },
      drivers: { ph: 'New driver, e.g. Phil C', items: S.meta.drivers.map((d) => ({ id: d.id, name: d.name, info: S.trailers.filter((t) => t.driver === d.name).map((t) => t.number) })) },
      locations: { ph: 'New location name', items: allLocations().filter((l) => !l.extra).map((l) => ({ id: l.id, name: l.name, lock: same(l.name, HOME), info: S.trailers.filter((t) => same(t.location, l.name)).map((t) => t.number) })) },
      users: { ph: 'New user name', items: S.meta.users.map((u) => ({ id: u.id, name: u.name, guest: u.role === 'guest', me: u.name === S.user })) },
    }[m.tab];
    body = `<div class="addrow"><input class="field" id="manage-new" placeholder="${cfg.ph}" data-autofocus data-enter="manage-add" ${edit}>
      <button class="btn primary" data-click="manage-add" ${edit}>Add</button></div><div class="list">
      ${cfg.items.map((it) => `<div class="li"><span>${esc(it.name)}
        ${it.lock ? '<span class="tag lock">PROTECTED</span>' : ''}${it.guest ? '<span class="tag guest">GUEST</span>' : ''}${it.me ? '<span class="tag">YOU</span>' : ''}
        ${it.info && it.info.length ? `<span class="tag">${it.info.length} in use</span>` : ''}</span>
        ${it.lock ? `<span title="Protected" style="color:var(--dim)">${icon('lock')}</span>` : `<button class="del" data-click="manage-del" data-id="${esc(it.id)}" ${edit} title="Remove">${icon('trash')}</button>`}</div>`).join('') || '<p class="note">Nothing here yet.</p>'}</div>`;
    if (m.tab === 'locations') body += `<p class="note" style="margin-top:12px"><b>${HOME}</b> is protected. Moving a trailer to ${HOME} un-hitches its unit and driver.</p>`;
    if (m.tab === 'users') body += `<p class="note" style="margin-top:12px">Names here appear on the login screen. They are names only, not passwords.</p>`;
  }
  return modalFrame('MANAGE', head + body, '', true);
}

function drawHistory(m) {
  const trailer = m.kind === 'thistory' ? findTrailer(m.id) : null;
  if (m.kind === 'thistory' && !trailer) return modalFrame('HISTORY', '<p class="note">This trailer no longer exists.</p>');
  const all = trailer ? trailer.history.map((e) => ({ ...e, trailerNo: trailer.number })) : boardHistory();
  const filt = m.filter || 'All';
  const list = filt === 'All' ? all : all.filter((e) => entryField(e) === filt);
  const shown = list.slice(0, 400);
  const tabs = `<div class="tabs">${HIST_FILTERS.map((k) => `<button class="tab ${filt === k ? 'on' : ''}" data-click="hist-filter" data-f="${k}">${k}</button>`).join('')}</div>`;
  const rows = shown.map((e) => {
    const f = entryField(e);
    return `<div class="he"><span class="f ${f}">${f.toUpperCase()}</span>
      <span>${trailer ? '' : `<b class="mono">${esc(e.trailerNo)}</b> • `}${esc(e.from)} → <b>${esc(e.to)}</b></span>
      <span class="w">${esc(e.date)} • by ${esc(e.user || '-')}</span></div>`;
  }).join('');
  const title = trailer ? `HISTORY • <span class="mono">${esc(trailer.number)}</span>` : 'BOARD HISTORY';
  return modalFrame(title, tabs + `<div class="hist">${rows || '<p class="note">No history.</p>'}</div>` +
    (list.length > shown.length ? `<p class="note">Showing newest ${shown.length} of ${list.length}.</p>` : ''),
    `<span class="note">${list.length} entries • newest first</span><span class="note">Each trailer keeps its last ${HISTORY_LIMIT} changes</span>`, true);
}

const BACKUP_TYPES = { auto: ['AUTO', ''], manual: ['CLOUD', 'lock'], 'pre-restore': ['SAFETY COPY', 'guest'] };
function drawBackups(m) {
  const row = (b, src) => {
    const [label, cls] = BACKUP_TYPES[b.type] || [String(b.type || 'OLD').toUpperCase(), ''];
    return `<div class="li"><span><b>${esc(b.backupAt || '?')}</b><span class="tag ${cls}">${esc(label)}</span>
      <span class="meta"> ${b.trailerCount ?? (b.trailers || []).length} trailers${b.by ? ' • by ' + esc(b.by) : ''}</span></span>
      <span style="display:flex;gap:6px"><button class="btn" data-click="bk-download" data-src="${src}" data-id="${esc(b.id)}" title="Save this backup to PC">${icon('download', 12)}</button>
      <button class="btn danger" data-click="bk-restore" data-src="${src}" data-id="${esc(b.id)}" ${canEdit() ? '' : 'disabled'}>Restore</button></span></div>`;
  };
  const last = S.meta.lastAutoBackupMs;
  const info = `<p class="note" style="margin:0 0 12px">Automatic cloud backup <b>every hour</b> while the board is open (newest ${AUTO_BACKUP_KEEP} kept).
    Last automatic backup: <b>${last ? esc(fmtDate(last)) : 'not yet'}</b>.<br>Every restore takes a <b>safety copy</b> first, so a restore can be undone.</p>`;
  const list = m.list === null ? '<p class="note">Loading…</p>'
    : (m.err ? `<p class="note">${esc(m.err)}</p>` : '') + (m.list.length ? m.list.map((b) => row(b, 'new')).join('') : '<p class="note">No backups yet. One is made automatically every 2 hours, or press Save Backup.</p>');
  const old = m.old === null
    ? `<button class="btn" data-click="bk-old">Show backups from the old version (v48)</button>`
    : `<p class="note"><b>Old version backups</b></p>${m.old.map((b) => row(b, 'old')).join('') || '<p class="note">None found.</p>'}`;
  return modalFrame('BACKUPS', info + `<div class="list">${list}</div><div class="list" style="margin-top:14px">${old}</div>`,
    `<label class="btn">${icon('upload')} Restore from a file on this PC… <input type="file" accept=".json,application/json" class="hidden" data-change="restore-file"></label>
     <button class="btn" data-click="backup-cloud" ${canEdit() ? '' : 'disabled'}>${icon('cloud')} Backup to Cloud now</button>`, true);
}

/* =====================================================================
   9. EVENTS (one listener for each kind of event, matched by data-*)
   ===================================================================== */
const CLICK = {
  'reload': () => location.reload(),
  'login': (el) => login(el.dataset.name),
  'logout': () => logout(),
  'setup-old': () => setupFromOld(),
  'loc-filter': (el) => { S.filters.location = same(S.filters.location, el.dataset.loc) ? '' : el.dataset.loc; render(true); },
  'clear-filters': () => { S.filters = { search: '', location: '', type: '', vorOnly: false }; invalidate(); render(true); },
  'add': () => { if (guard()) { S.modal = { kind: 'add' }; render(true); } },
  'add-save': () => addTrailer($('#add-num').value, $('#add-type').value, $('#add-loc').value),
  'history': () => { S.modal = { kind: 'history', filter: 'All' }; render(true); },
  'thistory': (el) => { S.modal = { kind: 'thistory', id: el.dataset.id, filter: 'All' }; render(true); },
  'hist-filter': (el) => { S.modal.filter = el.dataset.f; render(true); },
  'manage': (el) => { S.modal = { kind: 'manage', tab: el.dataset.tab }; render(true); },
  'manage-add': () => {
    const inp = $('#manage-new'); const v = inp.value.trim(); if (!v) return;
    inp.value = ''; MANAGE[S.modal.tab].add(v);
  },
  'manage-del': (el) => {
    const tab = S.modal.tab;
    if (tab === 'users' || confirm('Remove this from the list?')) MANAGE[tab].remove(el.dataset.id);
  },
  'del-trailer': (el) => deleteTrailer(el.dataset.id),
  'edit': (el) => {
    if (!canEdit()) return;
    const t = findTrailer(el.dataset.id);
    S.editing = { id: t.id, field: el.dataset.field, draft: t[el.dataset.field] };
    render(true);
  },
  'close': () => { S.modal = null; render(true); },
  'close-bg': (el, e) => { if (e.target === el) { S.modal = null; render(true); } },
  'backup-cloud': () => doCloudBackup(),
  'backup-pc': () => doSaveToPc(),
  'backups': () => openBackups(),
  'bk-old': () => loadOldBackups(),
  'bk-download': (el) => { const b = findBackup(el.dataset.src, el.dataset.id); if (b) download(`SK_BOARD_BACKUP_${b.backupAtMs || b.id}.json`, JSON.stringify(b, null, 2)); },
  'bk-restore': (el) => { const b = findBackup(el.dataset.src, el.dataset.id); if (b) restoreBoard(b, `backup from ${b.backupAt}`); },
  'print': () => printBoard(),
};

const CHANGE = {
  'remember': (el) => { S.remember = el.checked; },
  'setup-file': (el) => setupFromFile(el),
  'restore-file': async (el) => {
    try { const { data, name } = await readJsonFile(el); restoreBoard(data, 'file ' + name); }
    catch (e) { toast(friendlyError(e), true); }
  },
  'f-location': (el) => { S.filters.location = el.value; el.blur(); render(true); },
  'f-type': (el) => { S.filters.type = el.value; el.blur(); render(true); },
  'f-vor': (el) => { S.filters.vorOnly = el.checked; render(true); },
  'loc': (el) => { el.blur(); moveTrailer(el.dataset.id, el.value); },
  'unit': (el) => { el.blur(); setUnit(el.dataset.id, el.value); },
  'driver': (el) => { el.blur(); setDriver(el.dataset.id, el.value); },
  'vor': (el) => {
    const t = findTrailer(el.dataset.id);
    if (el.checked && (t.unit || t.driver) && !confirm(`Mark ${t.number} VOR? This also un-hitches its unit and driver.`)) { el.checked = false; return; }
    setVor(el.dataset.id, el.checked);
  },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-click]');
  if (el && CLICK[el.dataset.click] && !el.disabled) CLICK[el.dataset.click](el, e);
});
document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-change]');
  if (el && CHANGE[el.dataset.change]) CHANGE[el.dataset.change](el, e);
});
document.addEventListener('input', (e) => {
  if (e.target.dataset.input === 'search') { S.filters.search = e.target.value; render(); }
  if (e.target.id === 'editbox' && S.editing) S.editing.draft = e.target.value;
});

// Load / Notes editing: Enter or clicking away saves, Escape cancels.
function finishEdit(save) {
  const ed = S.editing; if (!ed) return;
  S.editing = null;
  render(true);
  if (save) setText(ed.id, ed.field, ed.draft);
}
document.addEventListener('keydown', (e) => {
  if (e.target.id === 'editbox') {
    if (e.key === 'Enter') { e.preventDefault(); finishEdit(true); }
    if (e.key === 'Escape') { e.preventDefault(); finishEdit(false); }
    return;
  }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter) { e.preventDefault(); CLICK[e.target.dataset.enter](); }
  if (e.key === 'Escape' && S.modal) { S.modal = null; render(true); }
});
document.addEventListener('focusout', (e) => { if (e.target.id === 'editbox' && S.editing) finishEdit(true); });

// Column resizing (widths remembered on this device).
let drag = null;
document.addEventListener('mousedown', (e) => {
  const h = e.target.closest('[data-resize]'); if (!h) return;
  e.preventDefault();
  drag = { col: h.dataset.resize, x: e.clientX, w: S.cols[h.dataset.resize] };
  document.body.style.cursor = 'col-resize';
});
document.addEventListener('mousemove', (e) => {
  if (!drag) return;
  S.cols[drag.col] = Math.max(60, drag.w + e.clientX - drag.x);
  const col = document.querySelector(`col[data-col="${drag.col}"]`);
  if (col) col.style.width = S.cols[drag.col] + 'px';
  const tbl = document.querySelector('table.board');
  if (tbl) tbl.style.width = Object.values(S.cols).reduce((a, b) => a + b, 0) + 'px';
});
document.addEventListener('mouseup', () => {
  if (!drag) return;
  drag = null; document.body.style.cursor = '';
  ls.set(LS_COLS, JSON.stringify(S.cols));
  render();
});

window.addEventListener('online', () => render());
window.addEventListener('offline', () => render());

/* =====================================================================
   10. START
   ===================================================================== */
startFirebase();
setInterval(maybeAutoBackup, 10 * 60e3);
setTimeout(maybeAutoBackup, 60e3);
</script>
</body>
</html>
